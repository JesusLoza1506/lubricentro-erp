name: CI

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Rust Backend (Check & Test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Vehiculo Integration Tests
        run: cargo test --test vehiculo_tests --manifest-path src-tauri/Cargo.toml

  integration-nubefact:
    name: NubeFact Sandbox Integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Run Integration Tests against Sandbox
        run: cargo test --test integration_nubefact --manifest-path src-tauri/Cargo.toml
        env:
          NUBEFACT_SANDBOX_TOKEN: ${{ secrets.NUBEFACT_SANDBOX_TOKEN }}

  frontend:
    name: React Frontend (Lint, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --passWithNoTests --ci

      - name: Build Frontend
        run: npm run build
