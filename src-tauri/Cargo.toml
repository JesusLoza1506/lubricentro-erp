[package]
name = "lubricentro-erp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "lubricentro-erp"

[lib]
name = "lubricentro_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "generar_hash"
path = "src/bin/generar_hash.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "2"
getrandom = "0.2"
dotenvy = "0.15"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1.10", features = ["v4"] }

# --- Dependencias auxiliares para servicios e integración ---
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }
