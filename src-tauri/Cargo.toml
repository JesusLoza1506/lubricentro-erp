[package]
name = "lubricentro-erp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lubricentro_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base de datos local cifrada usando SQLCipher empaquetado (Fase 1)
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "2.1"
tokio = { version = "1", features = ["full"] }
rand = "0.10.3"
getrandom = "0.4.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true